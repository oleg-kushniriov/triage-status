<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Triage Desk</title>
    
    <style>:root{--fg:#1f2328;--muted:#59636e;--bg:#fff;--line:#d1d9e0;--card:#f6f8fa;--red:#cf222e;--amber:#9a6700;--link:#0969da}@media(prefers-color-scheme:dark){:root{--fg:#e6edf3;--muted:#9198a1;--bg:#0d1117;--line:#3d444d;--card:#151b23;--red:#ff7b72;--amber:#d29922;--link:#58a6ff}}body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background:var(--bg);max-width:46rem;margin:0 auto;padding:2.5rem 1rem 3rem}a{color:var(--link)}.site{margin:0;color:var(--muted);font-size:.875rem}h1{font-size:1.5rem;line-height:1.25;margin:.25rem 0 .5rem}h2{font-size:1.05rem;margin:0 0 .5rem}.lead{margin:0 0 1.5rem;color:var(--muted)}section{background:var(--card);border:1px solid var(--line);border-radius:.5rem;padding:1rem;margin:0 0 1rem;overflow-x:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{text-align:right;padding:.4rem .5rem;border-top:1px solid var(--line)}thead th{border-top:0;color:var(--muted);font-size:.8rem;font-weight:500}th:first-child{text-align:left;font-weight:600}td{font-size:1.15rem}td.zero{color:var(--muted)}td.overdue:not(.zero){color:var(--red);font-weight:600}td.aging:not(.zero){color:var(--amber);font-weight:600}.open{display:inline-block;margin:.5rem 0 0;padding:.5rem .9rem;border:1px solid var(--line);border-radius:.4rem;background:var(--card);text-decoration:none;font-weight:600}.reach{margin:.75rem 0 0;color:var(--muted);font-size:.9rem}footer{margin-top:2rem;color:var(--muted);font-size:.85rem}</style>
  </head>
  <body>
    <p class="site">Triage Desk status</p>
    <h1>Opening Triage Desk</h1>
    <p class="lead">This address has no status page of its own.</p>
    <a class="open" id="open" href="https://oleg-traige-desk.runailabs.com/">Open in Triage Desk</a>
    <p class="reach" id="reach" hidden>Triage Desk did not answer from this network, so this page stays. It may only be reachable from inside your organization.</p>
    <footer><a href="https://oleg-kushniriov.github.io/triage-status/">All repositories</a></footer>
    <script>
      (function () {
        var to = (function () {
          var base = "/triage-status";
          var path = location.pathname;
          var rest = path.indexOf(base + '/') === 0 ? path.slice(base.length).replace(/\/+$/, '') : '';
          return "https://oleg-traige-desk.runailabs.com" + (rest ? '/repos' + rest : '/') + location.search + location.hash;
        })();
        var open = document.getElementById('open');
        if (open) open.href = to;
        var settled = false;
        function stay() {
          if (settled) return;
          settled = true;
          document.getElementById('reach').hidden = false;
        }
        var probe = new Image();
        probe.onload = function () {
          if (settled) return;
          settled = true;
          location.replace(to);
        };
        probe.onerror = stay;
        setTimeout(stay, 4000);
        probe.src = "https://oleg-traige-desk.runailabs.com/favicon-32.png" + '?' + Date.now();
      })();
    </script>
  </body>
</html>
